<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Marketplace - Listings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">🎓 Campus Marketplace</a>
      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Listings</a></li>
          <li data-role="member"><a href="manage.html">My area</a></li>
          <li data-role="moderator"><a href="moderator.html">Moderation</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1>Buy and sell on campus</h1>

    <!-- Role switch. There is no real authentication, the chosen role is only
         stored in localStorage and decides what the interface shows. -->
    <section class="panel" aria-labelledby="session-heading">
      <h2 id="session-heading">Who are you?</h2>
      <p id="session-info"></p>

      <form id="login-form" class="form-row" data-role="visitor" autocomplete="off" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <!-- autocomplete is off on purpose: this is a demo role switch, not a
               real login, so the browser should not offer saved accounts here. -->
          <input type="text" id="username" name="member-name" list="known-members"
                 maxlength="20" autocomplete="off" placeholder="e.g. maria">
          <datalist id="known-members">
            <option value="maria"></option>
            <option value="jonas"></option>
            <option value="aylin"></option>
          </datalist>
          <p class="error-message" id="error-username" role="alert"></p>
        </div>

        <div class="field">
          <label for="role">Log in as</label>
          <select id="role" name="role">
            <option value="member">Member</option>
            <option value="moderator">Moderator</option>
          </select>
        </div>

        <div class="field field-actions">
          <button type="submit" class="button">Log in</button>
        </div>
      </form>

      <button type="button" id="logout-button" class="button button-secondary"
              data-role="member moderator">Log out</button>
    </section>

    <!-- Search and filter. Every change re-renders the list with JavaScript,
         the page is never reloaded. -->
    <section class="panel" aria-labelledby="filter-heading">
      <div class="panel-head">
        <h2 id="filter-heading">Search and filter</h2>
        <button type="button" id="filter-toggle" class="button button-secondary"
                aria-expanded="true" aria-controls="filter-form">Hide filters</button>
      </div>

      <form id="filter-form" class="form-row" novalidate>
        <div class="field">
          <label for="keyword">Keyword</label>
          <input type="search" id="keyword" name="keyword" placeholder="e.g. bike">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="all">All categories</option>
          </select>
        </div>

        <div class="field">
          <label for="min-price">Price from (€)</label>
          <input type="number" id="min-price" name="min-price" min="0" step="1">
          <p class="error-message" id="error-min-price" role="alert"></p>
        </div>

        <div class="field">
          <label for="max-price">Price to (€)</label>
          <input type="number" id="max-price" name="max-price" min="0" step="1">
          <p class="error-message" id="error-max-price" role="alert"></p>
        </div>

        <div class="field field-actions">
          <button type="submit" class="button">Apply</button>
          <button type="button" id="reset-filter" class="button button-secondary">Reset</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="results-heading">
      <div class="panel-head">
        <h2 id="results-heading">Listings</h2>
        <a class="button" href="manage.html" data-role="member">Post a listing</a>
      </div>

      <p id="result-count" class="result-count"></p>
      <ul class="listing-grid" id="listing-grid"></ul>
      <p id="empty-message" class="empty-message is-hidden">No listings match your search.</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Campus Marketplace - student project, module B10 Web Application and Software Architecture.</p>
      <button type="button" id="reset-demo-data" class="button button-secondary">Reset demo data</button>
    </div>
  </footer>

  <!-- jQuery first, then our own scripts: data layer, helpers, page logic. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- If the CDN cannot be reached (no internet), load the local copy instead. -->
  <script>window.jQuery || document.write('<script src="js/vendor/jquery-3.7.1.min.js"><\/script>');</script>
  <script src="js/seed-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-index.js"></script>

</body>
</html>
